[project]
name = "agent-exchange"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "razorpay>=1.4.2",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "model2vec>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
semantic = ["sentence-transformers>=3.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
